[project]
name = "repository-sync"
version = "0.1.0"
description = "定时同步 Gitee / GitHub 仓库"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=44",
    "croniter>=5.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.6",
    "pymysql>=1.1",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uv]
package = false
